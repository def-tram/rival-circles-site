<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rival Circles | Tennis Clash concept</title>
<meta name="description" content="Clickable prototype of Rival Circles, a concept feature to lift Tennis Clash DAU by 10%.">
<meta name="theme-color" content="#173E3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/barlow-condensed-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;font-display:swap;src:url(assets/fonts/barlow-condensed-700-italic.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-display:swap;src:url(assets/fonts/barlow-condensed-800-italic.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:900;font-display:swap;src:url(assets/fonts/barlow-condensed-900-italic.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/barlow-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(assets/fonts/barlow-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/barlow-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(assets/fonts/barlow-700-normal.woff2) format('woff2')}
:root{--teal:#173E3F;--teal2:#0F2C2D;--blue:#404EF5;--mint:#68E1B0;--lime:#D3FA50;--royal:#13319A;--gold:#F6C343;--ink:#E9F2F1;--mute:#9DB8B6;
--g1:#3D8BFF;--g2:#1F56D6;--g3:#0E2F86;--d:'Barlow Condensed','Arial Narrow',sans-serif;--b:'Barlow',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--teal2);color:var(--ink);font-family:var(--b);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* ---------- shell ---------- */
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--teal);border-bottom:1px solid #24585a;flex:0 0 auto}
.brand{font-family:var(--d);font-style:italic;font-weight:900;font-size:22px;letter-spacing:.3px;line-height:1}
.brand b{color:var(--lime)}
.brand small{display:block;font:500 12px var(--b);font-style:normal;color:var(--mute);letter-spacing:0;margin-top:3px}
.seg{display:flex;background:#0f2e2f;border-radius:999px;padding:4px}
.seg button{padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--lime);color:#13261a}
.barR{margin-left:auto;display:flex;gap:10px;align-items:center}
.ghost{padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px;border:1.5px solid #3c7577;color:var(--ink)}
.ghost:hover{border-color:var(--lime);color:var(--lime)}
.solid{padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;background:var(--mint);color:#0f2c2d}
.stage{flex:1;display:flex;min-height:0}
.phoneWrap{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative;
 background:radial-gradient(ellipse at 50% 40%,#1d5153 0%,#0F2C2D 70%)}
.zig{position:absolute;inset:0;opacity:.07;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 38px,var(--mint) 38px 52px,transparent 52px 90px)}
.scaler{transform-origin:center center;position:relative;flex:0 0 auto}
.phone{width:414px;height:868px;border-radius:56px;background:#05090a;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 2px #2b5f61}
.screen{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:#1a3fae}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:32px;border-radius:20px;background:#000;z-index:50}
.side{width:430px;flex:0 0 430px;background:var(--teal);border-left:1px solid #24585a;display:flex;flex-direction:column;min-height:0}
.dHead{display:none}
.tabs{display:flex;gap:4px;padding:14px 22px 0;border-bottom:1px solid #24585a}
.tabs button{padding:10px 14px 12px;font-weight:700;font-size:14px;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--lime);border-bottom-color:var(--lime)}
.tabs .mobOnly{display:none}
.sideIn{padding:22px 24px 18px;overflow:auto;flex:1}
.kicker{font:600 12px var(--b);letter-spacing:1.4px;text-transform:uppercase;color:var(--mint)}
.stepT{font-family:var(--d);font-style:italic;font-weight:800;font-size:31px;line-height:1.02;margin:10px 0 12px}
.stepB{font-size:15.5px;line-height:1.55;color:#cfe0de}
.lever{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;background:#0f2e2f}
.lever i{width:10px;height:10px;border-radius:50%;display:inline-block}
.prog{height:6px;background:#0f2e2f;border-radius:6px;margin:14px 0 6px;overflow:hidden}
.prog div{height:100%;background:var(--lime);border-radius:6px;transition:width .3s}
.nav{display:flex;gap:10px;padding:14px 24px 20px;border-top:1px solid #24585a}
.nav button{flex:1;padding:13px;border-radius:12px;font-weight:700;font-size:15px}
.prev{background:#0f2e2f;color:var(--ink)}
.next{background:var(--lime);color:#13261a}
.nav button:disabled{opacity:.35;cursor:default}
.hint{font-size:12.5px;color:var(--mute);margin-top:14px;line-height:1.45}
.box{margin-top:16px;background:#0f2e2f;border-radius:14px;padding:14px 16px}
.boxH{font:700 11.5px var(--b);letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.box p{font-size:14.5px;line-height:1.5;color:#d5e6e4}
.ec{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 0;border-top:1px solid #1f4c4e;font-size:14px;color:#d5e6e4;line-height:1.35}
.ec:first-of-type{border-top:0}
.ec b{color:var(--lime);font:800 italic 15px var(--d);flex:0 0 26px}
.ec:hover span{color:var(--lime)}
.flow{margin:20px 0 4px;font-family:var(--d);font-style:italic;font-weight:800;font-size:19px;color:var(--lime)}
.flow:first-child{margin-top:4px}
.flowS{font-size:12.5px;color:var(--mute);margin-bottom:6px}
.sl{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:14px;color:#d5e6e4}
.sl:hover{background:#0f2e2f}.sl.on{background:#0f2e2f;color:var(--lime)}
.sl span{font:700 12px var(--b);color:var(--mute);width:26px;flex:0 0 26px}
.sl em{margin-left:auto;font:600 11px var(--b);font-style:normal;color:var(--mute);background:#0f2e2f;padding:2px 7px;border-radius:999px}
.sumRow{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:6px 0}
.sumRow b{font-family:var(--d);font-style:italic;font-size:20px}
.big{font-family:var(--d);font-style:italic;font-weight:900;font-size:54px;color:var(--lime);line-height:1}
/* KPI board */
.kpi{display:grid;grid-template-columns:1fr auto;gap:0;margin-top:4px}
.kpi div{padding:8px 0;border-top:1px solid #1f4c4e;font-size:14px;color:#cfe0de}
.kpi div:nth-child(-n+2){border-top:0}
.kpi .v{text-align:right;font:800 italic 17px var(--d);color:var(--ink);padding-left:10px}
.kpi .v.chg{color:var(--lime);animation:chg 1.4s ease}
@keyframes chg{0%{background:rgba(211,250,80,.35)}100%{background:transparent}}
.lv{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:10px;padding:5px 0;font-size:13.5px}
.lv .tr{height:10px;background:#173e3f;border-radius:6px;overflow:hidden}
.lv .tr i{display:block;height:100%;border-radius:6px;transition:width .6s cubic-bezier(.3,.8,.3,1)}
.lv b{font:800 italic 16px var(--d);text-align:right}
.lv.off{opacity:.35}
.gr{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid #1f4c4e;font-size:13.5px;color:#cfe0de;line-height:1.35}
.gr:first-of-type{border-top:0}.gr span:last-child{color:var(--mint);font-weight:600;text-align:right;flex:0 0 40%}
/* overlays */
.ov{position:fixed;inset:0;z-index:300;background:rgba(6,20,21,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:28px}
.ov.show{display:flex;animation:fdIn .25s}
.ovC{background:var(--teal);border:1px solid #2f6a6c;border-radius:24px;max-width:1100px;width:100%;max-height:100%;overflow:auto;padding:34px 38px 30px;position:relative;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.ovX{position:absolute;right:18px;top:16px;width:38px;height:38px;border-radius:50%;background:#0f2e2f;font:600 22px/38px var(--b);color:var(--ink);text-align:center}
.ovT{font-family:var(--d);font-style:italic;font-weight:900;font-size:46px;line-height:.98;margin:8px 0 10px}
.ovT b{color:var(--lime)}
.lead{font-size:17px;line-height:1.55;color:#d5e6e4;max-width:760px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.num{background:#0f2e2f;border-radius:16px;padding:16px 18px}
.num b{display:block;font:900 italic 40px/1 var(--d);color:var(--lime)}
.num span{display:block;font-size:13px;color:var(--mute);margin-top:6px;line-height:1.35}
.ovBtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ovBtns button{padding:13px 20px;border-radius:12px;font-weight:700;font-size:15px}
.disc{font-size:12px;color:var(--mute);margin-top:18px;line-height:1.5;border-top:1px solid #24585a;padding-top:14px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.pc{background:#0f2e2f;border-radius:16px;padding:16px 18px}
.pc h4{font:800 italic 21px var(--d);color:var(--lime);margin-bottom:6px}
.pc p,.pc li{font-size:14px;line-height:1.5;color:#d5e6e4}
.pc ul{padding-left:18px}.pc li{margin:3px 0}
.pc.w2{grid-column:span 2}.pc.w3{grid-column:span 3}
.hyp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.hyp div{border-left:3px solid;padding:2px 0 2px 10px;font-size:13.5px;line-height:1.45;color:#d5e6e4}
.hyp b{display:block;font:800 italic 16px var(--d);color:var(--ink)}
/* mobile handle */
.fab{display:none}
@media (max-width:860px){
 .bar{display:none}
 .stage{height:100%}
 .phoneWrap{background:#0b1f20}
 .zig{display:none}
 .phone{padding:0;border-radius:0;box-shadow:none;background:none;width:390px;height:844px}
 .screen{border-radius:0}.notch{display:none}
 .side{display:none}
 .side.open{display:flex;position:fixed;inset:0;width:auto;z-index:200;border-left:0;animation:drIn .28s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top)}
 @keyframes drIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
 .dHead{display:flex;align-items:center;gap:10px;padding:14px 16px 4px}
 .dHead .brand{font-size:19px}
 .dHead .seg{margin-left:auto}.dHead .seg button{padding:7px 12px;font-size:13px}
 .dX{width:36px;height:36px;border-radius:50%;background:#0f2e2f;font:600 20px/36px var(--b);text-align:center;flex:0 0 auto}
 .tabs{padding:6px 12px 0;overflow-x:auto}.tabs button{padding:10px 10px 12px;white-space:nowrap}
 .tabs .mobOnly{display:block}
 .sideIn{padding:18px 18px 14px}
 .nav{padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
 .fab{display:flex;flex-direction:column;align-items:center;gap:2px;position:fixed;right:0;top:46%;z-index:150;padding:8px 3px 8px 5px;border-radius:12px 0 0 12px;background:rgba(15,44,45,.78);border:1.5px solid var(--lime);border-right:0;color:var(--ink);font:700 10px var(--b);box-shadow:-4px 6px 18px rgba(0,0,0,.35);touch-action:none}
 .fab .i{width:18px;height:18px;border-radius:50%;background:var(--lime);color:#13261a;font:900 italic 13px/18px var(--d);text-align:center}
 .ov{padding:0;align-items:stretch}
 .ovC{border-radius:0;border:0;padding:calc(26px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}
 .ovT{font-size:38px}.lead{font-size:15.5px}
 .nums{grid-template-columns:1fr;gap:8px}.num{display:flex;align-items:center;gap:14px;padding:12px 14px}.num b{font-size:32px;flex:0 0 96px}.num span{margin:0}
 .pg{grid-template-columns:1fr}.pc.w2,.pc.w3{grid-column:auto}
 .hyp{grid-template-columns:1fr 1fr}
 .ovBtns button{flex:1}
}
/* ---------- game UI kit ---------- */
.full{position:absolute;inset:0}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dim{position:absolute;inset:0;background:rgba(5,15,45,.62)}
.gt{-webkit-text-stroke:.6px rgba(8,30,90,.55);paint-order:stroke fill;font-family:var(--d);font-style:italic;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 1px #0b2a6e;letter-spacing:.2px}
.gtl{font-family:var(--d);font-style:italic;font-weight:800}
.topbar{position:absolute;top:58px;left:12px;right:12px;display:flex;gap:8px;z-index:5}
.cur{flex:1;height:32px;background:#0a1a3f;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 10px;font-family:var(--d);font-style:italic;font-weight:800;font-size:18px;position:relative}
.cur:before{content:'+';position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:6px;background:#5bd12a;color:#fff;font:900 18px/22px var(--b);text-align:center}
.coin{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a6,#f5b80f 60%,#c98500);box-shadow:0 0 0 1.5px #a86a00;display:inline-block;flex:0 0 auto}
.gem{width:16px;height:16px;transform:rotate(45deg);background:linear-gradient(135deg,#9bf07a,#2fae2a);border-radius:3px;display:inline-block;box-shadow:0 0 0 1.5px #1d7a1d}
.pnl{background:linear-gradient(180deg,var(--g1),var(--g2));border:3px solid var(--g3);border-radius:16px;box-shadow:0 8px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35);position:relative}
.pnlH{background:linear-gradient(180deg,#62a8ff,#2f74ee);border-radius:12px 12px 0 0;padding:10px 14px;text-align:center;border-bottom:3px solid var(--g3)}
.x{position:absolute;right:-6px;top:-10px;width:30px;height:30px;border-radius:8px;background:#fff;color:#1F56D6;font:900 18px/28px var(--b);text-align:center;box-shadow:0 3px 0 #0E2F86}
.card{background:#fff;color:#16306b;border-radius:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-family:var(--d);font-style:italic;font-weight:900;font-size:21px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);letter-spacing:.3px;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.bg-green{background:linear-gradient(180deg,#8be03a,#45ad17);box-shadow:0 5px 0 #2c7a0c,inset 0 2px 0 rgba(255,255,255,.45)}
.bg-orange{background:linear-gradient(180deg,#ffcd3c,#f5901b);box-shadow:0 5px 0 #b95f06,inset 0 2px 0 rgba(255,255,255,.5)}
.bg-blue{background:linear-gradient(180deg,#4fb0ff,#1f6ae0);box-shadow:0 5px 0 #0E2F86,inset 0 2px 0 rgba(255,255,255,.45)}
.bg-lime{background:linear-gradient(180deg,#e6ff7a,#b7e01f);color:#183313;text-shadow:none;box-shadow:0 5px 0 #6f8f0a,inset 0 2px 0 rgba(255,255,255,.6)}
.bg-grey{background:linear-gradient(180deg,#9fb1cc,#6e83a6);box-shadow:0 5px 0 #455a7c}
.w100{width:100%}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--d);font-style:italic;font-weight:900;color:#fff;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.3);flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:700 12px var(--b)}
.hot{cursor:pointer}
.pulse{animation:pulse 1.6s ease-in-out infinite}
[class~=pulseZ]{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(211,250,80,.8)}50%{box-shadow:0 0 0 10px rgba(211,250,80,0)}}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row{display:flex;align-items:center}
.bar2{height:12px;border-radius:8px;background:rgba(0,0,0,.28);overflow:hidden;border:2px solid rgba(0,0,0,.2)}
.bar2 i{display:block;height:100%;background:linear-gradient(180deg,#e6ff7a,#9fd010);border-radius:6px}
.tab{position:absolute;left:0;right:0;bottom:0;height:70px;background:#0c1f4d;display:flex;align-items:center;justify-content:space-around;border-top:3px solid #081638}
.tab div{font:800 italic 14px var(--d);color:#8fb0e8}
.tab .on{color:#fff;background:linear-gradient(180deg,#2f74ee,#1F56D6);padding:10px 22px;border-radius:10px}
.lbl{font:800 italic 12px var(--d);letter-spacing:.6px;color:#bcd6ff;text-transform:uppercase}
table.st{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:14px}
table.st td{padding:7px 8px;background:rgba(255,255,255,.12)}
table.st tr td:first-child{border-radius:8px 0 0 8px}table.st tr td:last-child{border-radius:0 8px 8px 0;text-align:right}
table.st tr.me td{background:rgba(211,250,80,.28)}
.dot{width:34px;text-align:center;font:800 italic 13px var(--d);color:#cfe0ff}
.dot b{display:block;width:22px;height:22px;margin:4px auto 0;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.ins{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ins .row{justify-content:space-between;font-size:14px}
.cmp{display:flex;gap:4px;margin-top:6px;align-items:center}
.cmp i{height:8px;border-radius:4px;display:block}
.notif{background:rgba(245,245,250,.82);backdrop-filter:blur(8px);color:#111;border-radius:18px;padding:11px 13px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start}
.appI{width:36px;height:36px;border-radius:9px;background:var(--teal);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.appI i{width:20px;height:20px;border-radius:50%;background:var(--lime)}
.chest{width:170px;height:120px;position:relative;margin:0 auto}
.chest .base{position:absolute;bottom:0;left:0;right:0;height:78px;border-radius:12px 12px 16px 16px;background:linear-gradient(180deg,#ffd86b,#e09a12);border:4px solid #8a5200}
.chest .lid{position:absolute;top:0;left:-6px;right:-6px;height:56px;border-radius:40px 40px 10px 10px;background:linear-gradient(180deg,#fff0a3,#f4b52a);border:4px solid #8a5200;transform-origin:bottom center}
.chest .lock{position:absolute;left:50%;top:44px;transform:translateX(-50%);width:34px;height:40px;border-radius:8px;background:linear-gradient(180deg,#5ee0ff,#1f7be0);border:3px solid #0E2F86;z-index:3}
.chest.open .lid{animation:lid .6s ease forwards}
@keyframes lid{to{transform:translateY(-30px) rotate(-8deg)}}
.rays{position:absolute;inset:-60px;background:repeating-conic-gradient(rgba(255,240,150,.22) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 14s linear infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
